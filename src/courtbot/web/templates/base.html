<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>courtbot — {% block title %}status{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <script src="/static/htmx.min.js"></script>
  <style>
    body { max-width: 1100px; margin: 1rem auto; padding: 0 1rem; }
    nav ul { display: flex; gap: 1rem; list-style: none; padding: 0; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); }
    .card { border: 1px solid #ccc4; border-radius: 8px; padding: 1rem; }
    table { width: 100%; font-size: 0.9rem; }
    pre { white-space: pre-wrap; }
    .ok { color: #2ecc40; }
    .warn { color: #ff851b; }
    .err { color: #ff4136; }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><strong>courtbot</strong></li>
      <li><a href="/">Status</a></li>
      <li><a href="/bookings">Bookings</a></li>
      <li><a href="/discarded">Discarded</a></li>
      <li><a href="/logs">Logs</a></li>
      <li><a href="/config">Config</a></li>
    </ul>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
