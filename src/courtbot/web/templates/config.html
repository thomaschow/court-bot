{% extends "base.html" %}
{% block title %}config{% endblock %}
{% block content %}
<h2>Config</h2>
<p><small>{{ path }}</small></p>
<form method="post" action="/config">
  <textarea name="yaml_text" rows="30" style="width:100%; font-family: monospace;">{{ raw }}</textarea>
  <button type="submit">Save (validates with Pydantic)</button>
</form>
{% endblock %}
