[project]
name = "courtbot"
version = "0.1.0"
description = "Tennis court reservation bot for CourtReserve (Lifetime Activities)"
requires-python = ">=3.12"
dependencies = [
  "httpx[http2]>=0.27",
  "playwright>=1.45",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "structlog>=24.1",
  "keyring>=25.0",
  "APScheduler>=3.10",
  "lxml>=5.2",
  "tenacity>=8.3",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.5",
]

[project.scripts]
courtbot = "courtbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courtbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
